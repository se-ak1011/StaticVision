# Codemagic CI/CD — StaticVision
# Builds the iOS app and uploads it to TestFlight for internal testing.
#
# Signing is AUTOMATIC, matching the proven setup from the PAI app: the declarative
# `ios_signing` block + the shared `ios_signing` variable group (which holds the
# distribution certificate's private key and App Store Connect credentials). Codemagic
# uses these to fetch/create the App Store profile for com.static-vision.app and apply
# it. The "Codemagicc" profile (bound to com.pall.app) is not used — profiles are
# tied to a single bundle id.
#
# ── One-time setup in the Codemagic UI (already done for your other apps) ──
#   1. App Store Connect API key integration named `codemagicFlutter`.
#   2. Variable group `ios_signing` containing the signing credentials/cert key
#      (shared across the team, so it's reused here as-is).
#   3. Register the bundle id `com.static-vision.app` and create its app record in
#      App Store Connect.
#   4. (Optional) Variable group `staticvision_secrets` with SUPABASE_URL and
#      SUPABASE_ANON_KEY — only needed to override the values baked into
#      AppConfig.swift. The OpenAI key is NOT here; it lives server-side in the
#      openai-proxy Edge Function.

workflows:
  ios-testflight:
    name: StaticVision iOS – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagicFlutter   # App Store Connect API key (Key ID XNGK7F7SXJ)

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.static-vision.app
      groups:
        - ios_signing            # shared group: distribution cert private key + ASC creds (same as PAI)
      vars:
        XCODE_PROJECT: "StaticVision.xcodeproj"
        XCODE_SCHEME: "StaticVision"
        BUNDLE_ID: "com.static-vision.app"
      xcode: latest
      # Supabase URL/key are baked into AppConfig.swift. To override per-build,
      # add a group (e.g. `staticvision_secrets`) and inject into Info.plist.

    scripts:
      - name: Set build number
        script: |
          set -e
          # Codemagic auto-increments BUILD_NUMBER per workflow run, guaranteeing a
          # unique, increasing CFBundleVersion for every TestFlight upload.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "StaticVision/Info.plist"
          echo "CFBundleVersion set to ${BUILD_NUMBER}"

      - name: Set up code signing
        # The declarative `ios_signing` block above makes Codemagic fetch/create the
        # certificate and App Store profile during environment setup; this applies
        # them to the Xcode project.
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers receive processed builds automatically.
        # To also push to a named group, uncomment and match the group in App Store Connect:
        # beta_groups:
        #   - Internal Testers
