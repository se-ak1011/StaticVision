# Codemagic CI/CD — StaticVision  →  TestFlight
#
# Signing matches the working PAI app exactly: declarative `ios_signing`
# (distribution_type + bundle_identifier) + the shared `ios_signing` variable
# group + the `codemagicFlutter` App Store Connect API key integration. Codemagic
# manages the certificate, private key and provisioning profile automatically;
# `xcode-project use-profiles` applies them to the project.
#
# Supabase URL/key are baked into AppConfig.swift, so no Supabase vars are needed.

workflows:
  ios-testflight:
    name: StaticVision iOS – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagicFlutter

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.static-vision.app
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "StaticVision.xcodeproj"
        XCODE_SCHEME: "StaticVision"
        BUNDLE_ID: "com.static-vision.app"
      xcode: latest

    scripts:
      - name: Set unique build number
        script: |
          set -e
          BUILD_NUM=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "StaticVision/Info.plist"
          echo "CFBundleVersion set to $BUILD_NUM"

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
