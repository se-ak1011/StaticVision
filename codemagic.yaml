# Codemagic CI/CD — StaticVision
# Builds the iOS app and uploads it to TestFlight for internal testing.
#
# ── One-time setup in the Codemagic UI (Teams ▸ Integrations / App settings) ──
#   1. App Store Connect API key
#        • In App Store Connect ▸ Users and Access ▸ Integrations ▸ App Store Connect API,
#          create a key with the "App Manager" role and download the .p8 file.
#        • In Codemagic, add it under Teams ▸ Integrations ▸ App Store Connect.
#        • Replace `codemagic_asc_api_key` below with the name you gave that integration.
#   2. Encrypted variable group named `staticvision_secrets` containing:
#        • SUPABASE_URL        e.g. https://xxxx.supabase.co
#        • SUPABASE_ANON_KEY   the Supabase anon public key
#      (Mark them "Secure" so they're encrypted and stripped from logs.)
#      NOTE: the OpenAI key is NOT needed here — it lives server-side as a Supabase
#      secret used by the openai-proxy Edge Function (see supabase/functions/).
#   3. Register the bundle id `com.static-vision.app` for your Apple Developer account
#      (Codemagic can auto-create it on first build with the API key integration).

workflows:
  ios-testflight:
    name: StaticVision iOS – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic_asc_api_key   # ← name of your App Store Connect API key integration

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.static-vision.app
      groups:
        - staticvision_secrets                    # SUPABASE_URL, SUPABASE_ANON_KEY
      vars:
        XCODE_PROJECT: "StaticVision.xcodeproj"
        XCODE_SCHEME: "StaticVision"
        BUNDLE_ID: "com.static-vision.app"
      xcode: latest

    scripts:
      - name: Inject Supabase config into Info.plist
        script: |
          set -e
          PLIST="StaticVision/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL ${SUPABASE_URL}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY ${SUPABASE_ANON_KEY}" "$PLIST"
          echo "Injected Supabase config into $PLIST"

      - name: Set build number
        script: |
          set -e
          # Codemagic auto-increments BUILD_NUMBER per workflow run, guaranteeing a
          # unique, increasing CFBundleVersion for every TestFlight upload.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "StaticVision/Info.plist"
          echo "CFBundleVersion set to ${BUILD_NUMBER}"

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers receive processed builds automatically.
        # To also push to a named group, uncomment and match the group in App Store Connect:
        # beta_groups:
        #   - Internal Testers
