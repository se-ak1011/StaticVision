# Codemagic CI/CD — StaticVision
# Builds the iOS app and uploads it to TestFlight for internal testing.
#
# ── One-time setup in the Codemagic UI ──
#   1. App Store Connect API key integration named `codemagicFlutter`.
#   2. Add app-level environment variables:
#      SUPABASE_URL, SUPABASE_ANON_KEY.
#      App Store Connect credentials are expected from the
#      `codemagicFlutter` integration.
#   3. Register the bundle id `com.static-vision.app` and create its app record in
#      App Store Connect.

workflows:
  ios-testflight:
    name: StaticVision iOS – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagicFlutter

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.static-vision.app
      vars:
        XCODE_PROJECT: "StaticVision.xcodeproj"
        XCODE_SCHEME: "StaticVision"
        BUNDLE_ID: "com.static-vision.app"
      xcode: latest

    scripts:
      - name: Normalize bundle identifier variables
        script: |
          # BUNDLE_ID is defined in environment.vars above.
          if [[ -z "${BUNDLE_ID:-}" ]]; then
            echo "Missing required workflow variable: BUNDLE_ID"
            exit 1
          fi
          # The build machine initializes IOS_BUNDLE_IDENTIFIER from app/user env vars
          # before custom scripts run; force it to this workflow's canonical BUNDLE_ID.
          export IOS_BUNDLE_IDENTIFIER="$BUNDLE_ID"
          export PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"
          echo "Using bundle id: $BUNDLE_ID"

      - name: Print iOS signing assets detected by Codemagic
        script: |
          echo "== Code signing identities (name + SHA-1) =="
          security find-identity -v -p codesigning || true

          echo
          echo "== Provisioning profiles available =="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [[ -d "$PROFILE_DIR" ]]; then
            find "$PROFILE_DIR" -name "*.mobileprovision" -maxdepth 1 | while read -r profile; do
              echo
              echo "Profile file: $(basename "$profile")"
              security cms -D -i "$profile" > /tmp/codemagic_profile.plist
              /usr/libexec/PlistBuddy -c "Print :Name" /tmp/codemagic_profile.plist || true
              /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/codemagic_profile.plist || true
              /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/codemagic_profile.plist || true
            done
          else
            echo "No provisioning profiles directory found at $PROFILE_DIR"
          fi

      - name: Set unique build number
        script: |
          # Unix timestamp => always higher than the last upload, so App Store Connect
          # never rejects a build for a duplicate CFBundleVersion.
          BUILD_NUM=$(date +%s)
          echo "STATIC_VISION_BUILD_NUMBER=$BUILD_NUM" >> $CM_ENV
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "StaticVision/Info.plist"
          echo "CFBundleVersion set to $BUILD_NUM"

      - name: Validate App Store Connect secrets
        script: |
          export APP_STORE_CONNECT_KEY_IDENTIFIER="${APP_STORE_CONNECT_KEY_IDENTIFIER:-${APP_STORE_CONNECT_KEY_ID:-}}"
          REQUIRED_VARS=(
            APP_STORE_CONNECT_KEY_IDENTIFIER
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_PRIVATE_KEY
            SUPABASE_URL
            SUPABASE_ANON_KEY
            BUNDLE_ID
          )
          for VAR_NAME in "${REQUIRED_VARS[@]}"; do
            if [[ -z "${!VAR_NAME:-}" ]]; then
              echo "Missing required Codemagic secret: $VAR_NAME"
              exit 1
            fi
          done
          echo "App Store Connect secrets detected."

      - name: Set up code signing
        script: |
          export APP_STORE_CONNECT_KEY_IDENTIFIER="${APP_STORE_CONNECT_KEY_IDENTIFIER:-${APP_STORE_CONNECT_KEY_ID:-}}"
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key-password "${CERTIFICATE_PRIVATE_KEY_PASSWORD:-}" || true
          keychain add-certificates

          echo "== Certificates in keychain after setup =="
          security find-identity -v -p codesigning || true

          echo "== Provisioning profiles installed =="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          ls -1 "$PROFILE_DIR" 2>/dev/null || echo "No profiles directory found"

          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
